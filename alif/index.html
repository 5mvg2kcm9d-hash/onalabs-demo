<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08120F">
<title>Alif — Quran &amp; Prayer Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&family=Amiri+Quran&family=Amiri:wght@400;700&display=swap">
<style>
/* ===================================================== design tokens ==== */
:root{
  /* Light: limestone ground with a green bias; brass darkened to hold contrast */
  --ground:#E5EAE2; --ground-edge:#D6DDD1;
  --surface:#F7F9F4; --surface-2:#EDF1E9; --surface-3:#E1E7DC;
  --line:#CCD4C6; --line-soft:#DDE3D7;
  --text:#12201A; --text-2:#3B4B41; --muted:#6B7C71;
  --brass:#8A6A1E; --brass-2:#A98430; --brass-wash:#EFE6CF;
  --jade:#2C7A55; --jade-wash:#DCEBE1;
  --clay:#A54F39; --clay-wash:#F1DED7;
  --dusk:#4B5D95; --dusk-wash:#DEE2F0;
  --shadow:0 1px 2px rgba(18,32,26,.05), 0 10px 30px -16px rgba(18,32,26,.35);
  --tab-bg:rgba(247,249,244,.88);
  --scrim:rgba(18,32,26,.32);
  --frame:#C9D1C3;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#08120F; --ground-edge:#040A08;
    --surface:#0F1B16; --surface-2:#152420; --surface-3:#1D302A;
    --line:#22352E; --line-soft:#182821;
    --text:#E8EFE9; --text-2:#B7C7BD; --muted:#7E948A;
    --brass:#C9A24B; --brass-2:#E2C68C; --brass-wash:#241E10;
    --jade:#4E9A78; --jade-wash:#122A20;
    --clay:#C0705A; --clay-wash:#2B1712;
    --dusk:#7C8CC4; --dusk-wash:#151B2E;
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 22px 44px -26px #000;
    --tab-bg:rgba(8,18,15,.86);
    --scrim:rgba(0,0,0,.55);
    --frame:#151F1B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#08120F; --ground-edge:#040A08;
  --surface:#0F1B16; --surface-2:#152420; --surface-3:#1D302A;
  --line:#22352E; --line-soft:#182821;
  --text:#E8EFE9; --text-2:#B7C7BD; --muted:#7E948A;
  --brass:#C9A24B; --brass-2:#E2C68C; --brass-wash:#241E10;
  --jade:#4E9A78; --jade-wash:#122A20;
  --clay:#C0705A; --clay-wash:#2B1712;
  --dusk:#7C8CC4; --dusk-wash:#151B2E;
  --shadow:0 1px 0 rgba(255,255,255,.03), 0 22px 44px -26px #000;
  --tab-bg:rgba(8,18,15,.86);
  --scrim:rgba(0,0,0,.55);
  --frame:#151F1B;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
img{max-width:100%}
[hidden]{display:none !important}

/* ======================================================= device frame === */
.stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%,var(--ground) 0%,var(--ground-edge) 100%);padding:0}
.device{width:100%;max-width:100%;height:100dvh;position:relative;background:var(--ground);overflow:hidden}
@media (min-width:900px) and (min-height:760px){
  .stage{padding:28px}
  .device{width:412px;height:min(880px,calc(100dvh - 56px));border-radius:44px;
    box-shadow:0 0 0 10px var(--frame),0 0 0 11px rgba(0,0,0,.35),0 50px 90px -40px rgba(0,0,0,.7);}
  .device::after{content:"";position:absolute;top:10px;left:50%;transform:translateX(-50%);
    width:104px;height:26px;border-radius:16px;background:#05100C;z-index:60;opacity:.9}
}
.app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* ============================================================ screens === */
.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;padding:0 0 96px;display:none;scrollbar-width:thin}
.screen.is-active{display:block;animation:fade .28s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen.is-active{animation:none}*{transition-duration:.01ms !important}}
.screen::-webkit-scrollbar{width:6px}
.screen::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.pad{padding-inline:18px}

/* ============================================================== typo ==== */
.display{font-family:"Marcellus",Georgia,serif;font-weight:400;letter-spacing:.01em}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}

/* ============================================================ topbar ==== */
.topbar{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 18px 10px}
.topbar .loc{flex:1;min-width:0}
.topbar .loc b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .loc span{display:block;font-size:11.5px;color:var(--muted)}
.iconbtn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--line-soft);color:var(--text-2);flex:none}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================= sky ====== */
.sky{position:relative;margin:6px 14px 0;border-radius:26px;overflow:hidden;
  border:1px solid var(--line-soft);background:var(--surface);box-shadow:var(--shadow);isolation:isolate}
.sky-bg{position:absolute;inset:0;z-index:0;transition:background 1.2s linear;
  background:linear-gradient(170deg,var(--sky-a,#1B3350) 0%,var(--sky-b,#0F1B16) 78%)}
.sky-bg::after{content:"";position:absolute;inset:0;opacity:.5;
  background:radial-gradient(90% 60% at 78% 8%,rgba(255,255,255,.16),transparent 60%)}
.sky-in{position:relative;z-index:1;padding:20px 20px 18px;color:#F2F6F1}
.sky-in .eyebrow{color:rgba(242,246,241,.66)}
.next-name{font-size:30px;line-height:1.1;margin:6px 0 2px;color:#fff}
.count{font-size:44px;line-height:1;letter-spacing:.02em;color:#fff;margin-top:8px}
.count small{font-size:14px;letter-spacing:.06em;opacity:.7;margin-left:2px;font-family:"Manrope",sans-serif}
.count-sub{font-size:12.5px;color:rgba(242,246,241,.74);margin-top:8px}
.arc{margin-top:14px;width:100%;height:76px;display:block;overflow:visible}
.arc .track{stroke:rgba(255,255,255,.22);stroke-width:2;fill:none}
.arc .prog{stroke:#F3D89A;stroke-width:2.5;fill:none;stroke-linecap:round}
.arc .tick{fill:rgba(255,255,255,.55)}
.arc .tick.done{fill:#F3D89A}
.arc .lbl{fill:rgba(242,246,241,.72);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;
  font-family:"Manrope",sans-serif;font-weight:600}
.arc .sun{fill:#FFF3D6;filter:drop-shadow(0 0 6px rgba(255,220,150,.9))}

/* ============================================================ cards ===== */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:20px;margin:14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.card-h h2{font-size:13px;letter-spacing:.02em}
.card-h .more{margin-left:auto;font-size:12px;color:var(--brass);font-weight:600}

/* prayer rows */
.prow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line-soft);position:relative;text-align:left}
.prow:first-of-type{border-top:0}
.prow .glyph{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:var(--surface-2);color:var(--muted)}
.prow .glyph svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.prow .nm{flex:1;min-width:0}
.prow .nm b{display:block;font-weight:600;font-size:14.5px}
.prow .nm span{display:block;font-size:11px;color:var(--muted)}
.prow .tm{font-size:15px;font-weight:600;letter-spacing:.01em}
.prow.is-now{background:linear-gradient(90deg,var(--brass-wash),transparent 70%)}
.prow.is-now .glyph{background:var(--brass);color:#0B140F}
.prow.is-now::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--brass)}
.prow.is-past .tm,.prow.is-past .nm b{color:var(--muted)}
.prow .bell{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none}
.prow .bell[data-on="1"]{color:var(--brass)}
.prow .bell svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}
.prow .logdot{width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--line);flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--muted)}
.prow .logdot[data-s="jamaah"]{background:var(--jade);border:0;color:#fff}
.prow .logdot[data-s="ontime"]{background:var(--jade-wash);border:1.5px solid var(--jade);color:var(--jade)}
.prow .logdot[data-s="late"]{background:var(--dusk-wash);border:1.5px solid var(--dusk);color:var(--dusk)}
.prow .logdot[data-s="qada"]{background:var(--clay-wash);border:1.5px solid var(--clay);color:var(--clay)}
.prow .logdot[data-s="missed"]{background:var(--clay);border:0;color:#fff}

/* meta strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft);
  border-radius:16px;overflow:hidden;margin:14px}
.strip div,.strip button{background:var(--surface);padding:12px 10px;text-align:center;width:100%}
.strip.tools button{display:flex;flex-direction:column;align-items:center;gap:5px}
.strip.tools button:active{background:var(--surface-2)}
.strip b{display:block;font-size:15px;font-weight:600;margin-top:3px}
.strip span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ayah of the day */
.ayah-card{margin:14px;padding:18px 18px 16px;border-radius:20px;border:1px solid var(--line-soft);
  background:linear-gradient(160deg,var(--surface-2),var(--surface));box-shadow:var(--shadow)}
.ayah-ar{font-family:"Amiri Quran","Amiri",serif;font-size:22px;line-height:2.1;direction:rtl;text-align:right;margin:10px 0 12px;color:var(--text)}
.ayah-tx{font-size:13.5px;line-height:1.6;color:var(--text-2)}
.ayah-rf{margin-top:10px;font-size:11.5px;color:var(--brass);font-weight:600}

/* ============================================================ tabbar ==== */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
  gap:2px;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);
  background:var(--tab-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line-soft)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0 3px;color:var(--muted);border-radius:12px}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:9.5px;letter-spacing:.05em;font-weight:600}
.tab.is-active{color:var(--brass)}
.tab.is-active svg{stroke-width:1.9}

/* ============================================================ generic === */
.section-title{padding:18px 18px 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.list{background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;margin:0 14px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 15px;border-top:1px solid var(--line-soft);width:100%;text-align:left}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:500;font-size:14.5px}
.li .t span{display:block;font-size:11.5px;color:var(--muted)}
.li .v{font-size:13px;color:var(--muted);text-align:right;max-width:52%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .chev{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.6;flex:none}
.badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:6px;
  background:var(--surface-3);color:var(--muted)}
.badge.mecca{background:var(--brass-wash);color:var(--brass)}
.badge.medina{background:var(--jade-wash);color:var(--jade)}

/* switch */
.sw{width:44px;height:26px;border-radius:14px;background:var(--surface-3);position:relative;flex:none;transition:background .18s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.sw[data-on="1"]{background:var(--jade)}
.sw[data-on="1"]::after{transform:translateX(18px)}

/* segmented */
.seg{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:3px;margin:0 14px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.is-on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* ============================================================= qibla ==== */
.compass-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 18px 0}
.compass{width:min(300px,78vw);aspect-ratio:1;position:relative;margin-top:8px}
.compass svg{width:100%;height:100%;overflow:visible}
.c-ring{fill:none;stroke:var(--line);stroke-width:1}
.c-face{fill:var(--surface)}
.c-tick{stroke:var(--line);stroke-width:1}
.c-tick.major{stroke:var(--muted);stroke-width:1.6}
.c-card{fill:var(--muted);font-size:9px;font-weight:700;letter-spacing:.1em;font-family:"Manrope",sans-serif}
.c-card.n{fill:var(--clay)}
.c-needle{fill:var(--brass)}
.c-kaaba{fill:var(--text)}
.qibla-read{text-align:center;margin-top:18px}
.qibla-read .deg{font-size:40px;line-height:1}
.qibla-read .sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.aligned{color:var(--jade);font-weight:700}

/* =========================================================== tracker ==== */
.streak{margin:14px;padding:18px;border-radius:20px;border:1px solid var(--line-soft);box-shadow:var(--shadow);
  background:linear-gradient(150deg,var(--brass-wash),var(--surface) 70%);display:flex;align-items:center;gap:16px}
.streak .big{font-size:42px;line-height:1;color:var(--brass)}
.streak .txt{flex:1}
.streak .txt b{display:block;font-size:14px}
.streak .txt span{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px 16px 16px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--surface-2);display:block;position:relative}
.heat i[data-n="1"]{background:color-mix(in oklab,var(--jade) 22%,var(--surface-2))}
.heat i[data-n="2"]{background:color-mix(in oklab,var(--jade) 40%,var(--surface-2))}
.heat i[data-n="3"]{background:color-mix(in oklab,var(--jade) 58%,var(--surface-2))}
.heat i[data-n="4"]{background:color-mix(in oklab,var(--jade) 76%,var(--surface-2))}
.heat i[data-n="5"]{background:var(--jade)}
.heat i.today{box-shadow:0 0 0 2px var(--brass)}
.heat-legend{display:flex;align-items:center;gap:6px;padding:0 16px 14px;font-size:10.5px;color:var(--muted)}
.heat-legend i{width:11px;height:11px;border-radius:3px;display:block;background:var(--surface-2)}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding:12px 16px 6px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars .b{width:100%;border-radius:6px 6px 3px 3px;background:var(--jade);min-height:3px;transition:height .4s ease}
.bars .b.low{background:var(--clay)}
.bars .b.mid{background:var(--brass)}
.bars span{font-size:9.5px;color:var(--muted);font-weight:600}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);border-radius:16px;overflow:hidden;margin:14px}
.statgrid div{background:var(--surface);padding:14px}
.statgrid b{display:block;font-size:22px;font-weight:600;font-family:"Marcellus",serif}
.statgrid span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pct-row{display:flex;align-items:center;gap:10px;padding:9px 16px}
.pct-row .nmm{width:58px;font-size:13px;font-weight:600}
.pct-row .barw{flex:1;height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.pct-row .barf{height:100%;border-radius:4px;background:var(--jade)}
.pct-row .val{width:38px;text-align:right;font-size:12px;color:var(--muted);font-weight:600}

/* ============================================================= quran ==== */
.searchbar{margin:6px 14px 10px;display:flex;align-items:center;gap:9px;background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:13px;padding:9px 12px}
.searchbar input{flex:1;border:0;background:none;outline:none;font-size:14px}
.searchbar svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.7}
.surah{display:flex;align-items:center;gap:13px;padding:11px 15px;border-top:1px solid var(--line-soft);width:100%;text-align:left}
.surah:first-child{border-top:0}
.surah .idx{width:34px;height:34px;flex:none;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--brass)}
.surah .idx::before{content:"";position:absolute;width:34px;height:34px;border:1px solid var(--brass);opacity:.35;
  transform:rotate(45deg);border-radius:8px}
.surah .idxw{position:relative;display:grid;place-items:center;width:34px;height:34px;flex:none}
.surah .info{flex:1;min-width:0}
.surah .info b{display:block;font-size:14.5px;font-weight:600}
.surah .info span{display:block;font-size:11.5px;color:var(--muted)}
.surah .arname{font-family:"Amiri","Amiri Quran",serif;font-size:19px;color:var(--text-2);white-space:nowrap}

.reader{position:absolute;left:0;right:0;top:0;bottom:calc(env(safe-area-inset-bottom) + 61px);
  background:var(--ground);z-index:45;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.reader.is-open{transform:none}
.reader-top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 14px 10px;
  border-bottom:1px solid var(--line-soft);background:var(--surface)}
.reader-top .ttl{flex:1;min-width:0;text-align:center}
.reader-top .ttl b{display:block;font-size:14.5px;font-weight:600}
.reader-top .ttl span{display:block;font-size:11px;color:var(--muted)}
.reader-body{flex:1;overflow-y:auto;padding:0 0 78px}
.bism{text-align:center;font-family:"Amiri Quran","Amiri",serif;font-size:23px;padding:22px 24px 6px;color:var(--brass)}
.surah-plate{margin:14px;padding:16px;border:1px solid var(--brass);border-radius:16px;text-align:center;
  background:var(--brass-wash)}
.surah-plate .ar{font-family:"Amiri","Amiri Quran",serif;font-size:26px;color:var(--text)}
.surah-plate .meta{font-size:11.5px;color:var(--muted);margin-top:4px}
.ayah{padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.ayah:target,.ayah.is-hl{background:var(--brass-wash)}
.ayah-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ayah-no{font-size:10.5px;font-weight:700;color:var(--brass);letter-spacing:.06em;
  border:1px solid var(--brass);border-radius:20px;padding:2px 8px}
.ayah-head .sp{flex:1}
.ayah-head button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ayah-head button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ayah-head button.on{color:var(--brass)}
.ayah-head button.on svg{fill:currentColor}
.ar-text{font-family:"Amiri Quran","Amiri",serif;direction:rtl;text-align:right;
  font-size:var(--ar-size,26px);line-height:2.15;color:var(--text)}
.tr-text{font-size:calc(var(--tx-size,14px) - 1px);color:var(--muted);font-style:italic;margin-top:10px;line-height:1.6}
.tx-text{font-size:var(--tx-size,14px);color:var(--text-2);margin-top:10px;line-height:1.65;max-width:62ch}
.sajda-tag{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--clay);margin-top:8px}
.reader-foot{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 14px;
  background:var(--tab-bg);backdrop-filter:blur(16px);border-top:1px solid var(--line-soft)}
.reader-foot button{flex:1;padding:10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line-soft);
  font-size:12.5px;font-weight:600;color:var(--text-2)}
.reader-foot button:disabled{opacity:.35}

/* ============================================================ sheets ==== */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.is-open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:80;background:var(--surface);
  border-radius:24px 24px 0 0;border-top:1px solid var(--line);max-height:88%;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .3s cubic-bezier(.32,.72,0,1);box-shadow:0 -20px 50px -30px rgba(0,0,0,.6)}
.sheet.is-open{transform:none}
.sheet-grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:9px auto 4px;flex:none}
.sheet-h{display:flex;align-items:center;gap:10px;padding:6px 18px 10px}
.sheet-h h3{flex:1;font-size:15px;font-weight:600}
.sheet-h button{font-size:13px;font-weight:600;color:var(--brass)}
.sheet-body{overflow-y:auto;padding:0 0 calc(env(safe-area-inset-bottom) + 18px)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 18px;border-top:1px solid var(--line-soft)}
.opt .t{flex:1}
.opt .t b{display:block;font-weight:500;font-size:14px}
.opt .t span{display:block;font-size:11.5px;color:var(--muted)}
.opt .tick{width:18px;height:18px;stroke:var(--brass);fill:none;stroke-width:2.2;opacity:0}
.opt.is-on .tick{opacity:1}
.opt.is-on .t b{color:var(--brass);font-weight:600}

/* stepper */
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:10px;padding:2px}
.stepper button{width:30px;height:28px;border-radius:8px;font-size:16px;font-weight:600;color:var(--text-2);display:grid;place-items:center}
.stepper b{min-width:52px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums}

/* tasbih */
.tasbih{display:flex;flex-direction:column;align-items:center;padding:10px 18px 0}
.beadbtn{width:min(230px,62vw);aspect-ratio:1;border-radius:50%;margin:14px 0 4px;position:relative;
  background:radial-gradient(120% 120% at 30% 25%,var(--surface-2),var(--surface-3));
  border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.08);
  display:grid;place-items:center}
.beadbtn:active{transform:scale(.98)}
.beadbtn .n{font-size:56px;line-height:1;font-family:"Marcellus",serif;color:var(--brass)}
.beadbtn .of{font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.1em}
.dhikr-ar{font-family:"Amiri Quran","Amiri",serif;font-size:26px;text-align:center;margin-top:6px}
.dhikr-tr{font-size:12.5px;color:var(--muted);text-align:center}

/* misc */
.note{margin:14px;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-soft);
  font-size:12px;color:var(--muted);line-height:1.5}
.btn{display:block;width:calc(100% - 28px);margin:14px;padding:13px;border-radius:14px;background:var(--brass);
  color:#0B140F;font-weight:700;font-size:14px;text-align:center}
.btn.ghost{background:var(--surface-2);color:var(--text-2);border:1px solid var(--line)}
.btn.danger{background:var(--clay-wash);color:var(--clay);border:1px solid var(--clay)}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,14px);z-index:90;background:var(--text);
  color:var(--ground);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;opacity:0;
  pointer-events:none;transition:opacity .2s,transform .2s;max-width:86%;text-align:center}
.toast.is-on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;padding:36px 24px;color:var(--muted);font-size:13px;line-height:1.6}
.empty .mark{font-family:"Amiri","Amiri Quran",serif;font-size:40px;color:var(--line);display:block;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 16px 16px}
.cal .dow{font-size:9.5px;text-align:center;color:var(--muted);font-weight:700;letter-spacing:.06em;padding-bottom:4px}
.cal .day{aspect-ratio:1;border-radius:9px;background:var(--surface-2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--text-2);position:relative}
.cal .day.blank{background:none}
.cal .day.today{box-shadow:0 0 0 1.5px var(--brass)}
.cal .day .pips{display:flex;gap:1.5px}
.cal .day .pips i{width:3px;height:3px;border-radius:50%;background:var(--jade)}
.mtable{width:100%;border-collapse:collapse;font-size:12.5px}
.mtable th,.mtable td{padding:7px 4px;text-align:center;border-top:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
.mtable th{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;border:0}
.mtable td:first-child,.mtable th:first-child{text-align:left;padding-left:14px}
.mtable tr.today td{background:var(--brass-wash);font-weight:700}
.tblwrap{overflow-x:auto;margin:0 0 10px}

/* ===================================================== names & calendar = */
.name-row{display:flex;align-items:center;gap:13px;padding:12px 15px;border-top:1px solid var(--line-soft);width:100%;text-align:left}
.name-row:first-child{border-top:0}
.name-row .no{width:30px;height:30px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;
  color:var(--brass);border:1px solid var(--brass);border-radius:50%;opacity:.75}
.name-row .info{flex:1;min-width:0}
.name-row .info b{display:block;font-size:14px;font-weight:600}
.name-row .info span{display:block;font-size:11.5px;color:var(--muted)}
.name-row .ar{font-family:"Amiri","Amiri Quran",serif;font-size:24px;color:var(--text);white-space:nowrap}
.name-hero{margin:14px;padding:22px 18px;border-radius:20px;text-align:center;border:1px solid var(--brass);
  background:linear-gradient(160deg,var(--brass-wash),var(--surface) 75%)}
.name-hero .ar{font-family:"Amiri","Amiri Quran",serif;font-size:46px;line-height:1.5;color:var(--text)}
.name-hero .tl{font-size:15px;font-weight:600;margin-top:2px}
.name-hero .mn{font-size:13px;color:var(--brass);font-weight:600;margin-top:2px}
.hcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 14px 14px}
.hcal .dow{font-size:9.5px;text-align:center;color:var(--muted);font-weight:700;letter-spacing:.06em;padding-bottom:4px}
.hcal .cell{aspect-ratio:.92;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;position:relative;border:1px solid transparent}
.hcal .cell.blank{background:none}
.hcal .cell b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.hcal .cell span{font-size:9px;color:var(--muted)}
.hcal .cell.friday{background:var(--jade-wash)}
.hcal .cell.today{border-color:var(--brass);background:var(--brass-wash)}
.hcal .cell.event::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--clay)}
.evrow{display:flex;align-items:center;gap:12px;padding:11px 15px;border-top:1px solid var(--line-soft)}
.evrow:first-child{border-top:0}
.evrow .t{flex:1;min-width:0}
.evrow .t b{display:block;font-size:14px;font-weight:600}
.evrow .t span{display:block;font-size:11.5px;color:var(--muted)}
.evrow .cd{font-size:12px;font-weight:700;color:var(--brass);text-align:right;white-space:nowrap}
.evrow.is-today{background:var(--brass-wash)}

/* ============================================================ onboarding */
.onboard{position:absolute;inset:0;z-index:95;background:var(--ground);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 26px) 22px calc(env(safe-area-inset-bottom) + 20px)}
.onboard .mark{font-family:"Amiri","Amiri Quran",serif;font-size:56px;color:var(--brass);text-align:center;line-height:1}
.onboard h2{font-family:"Marcellus",Georgia,serif;font-size:26px;font-weight:400;text-align:center;margin-top:14px}
.onboard p{text-align:center;color:var(--muted);font-size:13.5px;margin-top:8px;max-width:34ch;margin-inline:auto;line-height:1.6}
.onboard .steps{display:flex;gap:5px;justify-content:center;margin-top:16px}
.onboard .steps i{width:22px;height:3px;border-radius:2px;background:var(--line);display:block}
.onboard .steps i.on{background:var(--brass)}
.onboard .ob-body{flex:1;overflow-y:auto;margin-top:18px}
.onboard .ob-foot{display:flex;gap:10px;padding-top:12px}
.onboard .ob-foot .btn{margin:0;width:auto;flex:1}
.ob-choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);margin-bottom:8px}
.ob-choice.is-on{border-color:var(--brass);background:var(--brass-wash)}
.ob-choice .t{flex:1}
.ob-choice .t b{display:block;font-size:14px;font-weight:600}
.ob-choice .t span{display:block;font-size:11.5px;color:var(--muted)}

/* Ramadan card */
.ramadan{margin:14px;padding:16px 18px;border-radius:20px;border:1px solid var(--brass);
  background:linear-gradient(150deg,var(--brass-wash),var(--surface) 75%);display:flex;align-items:center;gap:16px}
.ramadan .lbl{flex:1}
.ramadan .lbl b{display:block;font-size:14px}
.ramadan .lbl span{font-size:11.5px;color:var(--muted)}
.ramadan .cd{font-family:"Marcellus",serif;font-size:26px;color:var(--brass);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="stage">
<div class="device">
<div class="app" id="app">
  <div class="screens" id="screens">

    <!-- ============================================ TODAY -->
    <section class="screen is-active" data-screen="today" id="s-today">
      <header class="topbar">
        <button class="iconbtn" id="btn-location" aria-label="Change location">
          <svg viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></svg>
        </button>
        <div class="loc">
          <b id="loc-name">Amsterdam</b>
          <span id="date-line">—</span>
        </div>
        <button class="iconbtn" id="btn-notif" aria-label="Notifications">
          <svg viewBox="0 0 24 24"><path d="M18 15v-4a6 6 0 1 0-12 0v4l-1.6 2.4h15.2Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        </button>
      </header>

      <div class="sky">
        <div class="sky-bg" id="sky-bg"></div>
        <div class="sky-in">
          <div class="eyebrow" id="next-label">Next prayer</div>
          <div class="next-name display" id="next-name">—</div>
          <div class="count display num" id="countdown">--:--:--</div>
          <div class="count-sub" id="count-sub">—</div>
          <svg class="arc" id="arc" viewBox="0 0 340 76" aria-hidden="true"></svg>
        </div>
      </div>

      <div class="card" id="times-card"></div>

      <div class="strip" id="sun-strip"></div>

      <div class="strip tools" id="tools-strip"></div>

      <div class="ayah-card" id="ayah-card"></div>

      <div class="card" id="event-card" hidden></div>
      <div style="height:8px"></div>
    </section>

    <!-- ============================================ QURAN -->
    <section class="screen" data-screen="quran" id="s-quran">
      <header class="topbar">
        <div class="loc"><b>Quran</b><span id="quran-sub">114 surahs · 6,236 ayahs</span></div>
        <button class="iconbtn" id="btn-quran-settings" aria-label="Reading settings">
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h8M16 17h4"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="14" cy="17" r="2"/></svg>
        </button>
      </header>
      <div class="searchbar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="quran-search" type="search" placeholder="Search surah, juz or ayah text" autocomplete="off">
      </div>
      <div class="seg" id="quran-seg">
        <button data-mode="surah" class="is-on">Surah</button>
        <button data-mode="juz">Juz</button>
        <button data-mode="bookmarks">Saved</button>
      </div>
      <div id="quran-continue"></div>
      <div class="list" id="quran-list" style="margin-top:12px"></div>
      <div style="height:12px"></div>
    </section>

    <!-- ============================================ QIBLA -->
    <section class="screen" data-screen="qibla" id="s-qibla">
      <header class="topbar">
        <div class="loc"><b>Qibla</b><span id="qibla-loc">—</span></div>
        <button class="iconbtn" id="btn-calibrate" aria-label="Calibration help">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8.5v.01"/></svg>
        </button>
      </header>
      <div class="compass-wrap">
        <div class="compass" id="compass"></div>
        <div class="qibla-read">
          <div class="deg display num" id="qibla-deg">—</div>
          <div class="sub" id="qibla-sub">Direction of the Kaaba from your location</div>
        </div>
      </div>
      <button class="btn" id="btn-compass-start">Enable live compass</button>
      <div class="note" id="qibla-note"></div>
      <div class="strip" id="qibla-strip"></div>
      <div style="height:8px"></div>
    </section>

    <!-- ============================================ TRACKER -->
    <section class="screen" data-screen="tracker" id="s-tracker">
      <header class="topbar">
        <div class="loc"><b>Prayer tracker</b><span id="tracker-sub">—</span></div>
        <button class="iconbtn" id="btn-tracker-cal" aria-label="Month view">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/></svg>
        </button>
      </header>
      <div class="streak" id="streak-card"></div>
      <div class="card">
        <div class="card-h"><h2 class="eyebrow">Today · tap to cycle status</h2></div>
        <div id="track-today"></div>
      </div>
      <div class="card">
        <div class="card-h"><h2 class="eyebrow">Last 12 weeks</h2><span class="more num" id="heat-total"></span></div>
        <div class="heat" id="heat"></div>
        <div class="heat-legend"><span>Less</span><i data-n="0"></i><i data-n="1"></i><i data-n="2"></i><i data-n="3"></i><i data-n="4"></i><i data-n="5"></i><span>All 5</span></div>
      </div>
      <div class="card">
        <div class="card-h"><h2 class="eyebrow">This week</h2><span class="more num" id="week-pct"></span></div>
        <div class="bars" id="week-bars"></div>
      </div>
      <div class="card">
        <div class="card-h"><h2 class="eyebrow">Consistency by prayer · 30 days</h2></div>
        <div id="pct-rows" style="padding-bottom:10px"></div>
      </div>
      <div class="statgrid" id="stat-grid"></div>
      <div style="height:8px"></div>
    </section>

    <!-- ============================================ MORE -->
    <section class="screen" data-screen="more" id="s-more">
      <header class="topbar">
        <div class="loc"><b>Settings</b><span>Alif · Quran &amp; Prayer Times</span></div>
      </header>
      <div id="more-body"></div>
    </section>

  </div>

      <div class="reader" id="reader">
    <div class="reader-top">
      <button class="iconbtn" id="reader-back" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg>
      </button>
      <div class="ttl"><b id="reader-title">—</b><span id="reader-sub">—</span></div>
      <button class="iconbtn" id="reader-settings" aria-label="Reading settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 12h4M12 12h8M4 17h8M16 17h4"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="14" cy="17" r="2"/></svg>
      </button>
    </div>
    <div class="reader-body" id="reader-body"></div>
    <div class="reader-foot">
      <button id="reader-prev">← Previous</button>
      <button id="reader-next">Next →</button>
    </div>
  </div>

  <div class="reader" id="page">
    <div class="reader-top">
      <button class="iconbtn" id="page-back" aria-label="Back">
        <svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg>
      </button>
      <div class="ttl"><b id="page-title">—</b><span id="page-sub">—</span></div>
      <button class="iconbtn" id="page-action" aria-label="Action" hidden>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      </button>
    </div>
    <div class="reader-body" id="page-body"></div>
  </div>

  <nav class="tabbar" id="tabbar" role="tablist">
    <button class="tab is-active" data-tab="today" role="tab" aria-selected="true">
      <svg viewBox="0 0 24 24"><path d="M3 14h18M5.5 14a6.5 6.5 0 0 1 13 0"/><path d="M12 3.5v2M4.4 6.9l1.4 1.4M19.6 6.9l-1.4 1.4M2.5 18.5h19"/></svg><span>Today</span>
    </button>
    <button class="tab" data-tab="quran" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v14H6.5A2.5 2.5 0 0 0 4 19.5Z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H19v4H6.5A2.5 2.5 0 0 1 4 19.5Z"/><path d="M11.5 7.5h4"/></svg><span>Quran</span>
    </button>
    <button class="tab" data-tab="qibla" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.2 8.8-2 4.4-4.4 2 2-4.4z"/></svg><span>Qibla</span>
    </button>
    <button class="tab" data-tab="tracker" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M4 19V9M9.3 19V5M14.7 19v-7M20 19v-4"/></svg><span>Tracker</span>
    </button>
    <button class="tab" data-tab="more" role="tab" aria-selected="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6"/><path d="M19.4 14.6a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-2.87 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.93-1.16l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 3.1 14H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.16-2.93l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.93 1.16l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 20.9 10H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 .6Z"/></svg><span>More</span>
    </button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grab"></div>
    <div class="sheet-h"><h3 id="sheet-title">—</h3><button id="sheet-close">Done</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>
</div>
</div>

<script src="data/surahs.js"></script>
<script src="data/cities.js"></script>
<script src="data/names99.js"></script>
<script src="js/times.js"></script>
<script src="js/app.js"></script>
<script src="js/quran.js"></script>
<script src="js/extras.js"></script>
</body>
</html>
